name: CI

on:
  pull_request:
  push:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # Contract drift gate (CMS-001): the committed generated client must
      # match the vendored OpenAPI spec, and the spec must be the version this
      # client declares. Regeneration diff fails the build.
      - run: pnpm api:check
      - run: pnpm test
      - run: pnpm build

  # The unit suite again on the newest Node release. Developer machines run
  # whatever Homebrew ships, and Node 25 broke the suite while CI stayed green
  # on 22 (vitest.environment.ts). `latest` is deliberate: the next major
  # shows up here first. Not a required check, so a new Node can't block merges.
  unit-latest-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: pnpm
      - run: node --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Runs against the MSW mock contract: role matrix, import flow, a11y.
      - run: pnpm test:e2e
        env:
          VITE_USE_MOCK: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
